<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turbo Config Generator</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{
background:#030712;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

body::before{
content:"";
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,#00ffff33,transparent);
top:-300px;
left:-300px;
}

body::after{
content:"";
position:fixed;
width:800px;
height:800px;
background:radial-gradient(circle,#3b82f633,transparent);
bottom:-300px;
right:-300px;
}

.container{
width:95%;
max-width:900px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 50px rgba(0,255,255,.15);
z-index:1;
}

.logo{
font-size:36px;
font-weight:bold;
text-align:center;
color:#38bdf8;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.8;
margin-bottom:25px;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:25px;
}

.card{
padding:20px;
background:rgba(255,255,255,.05);
border-radius:20px;
text-align:center;
}

.card h3{
color:#22d3ee;
margin-bottom:10px;
}

.buttons{
display:flex;
gap:15px;
margin-top:20px;
flex-wrap:wrap;
}

button,
.download{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:18px;
cursor:pointer;
text-decoration:none;
text-align:center;
transition:.3s;
}

.generate{
background:#06b6d4;
color:white;
}

.generate:hover{
transform:translateY(-3px);
box-shadow:0 0 30px #06b6d4;
}

.download{
display:none;
background:#22c55e;
color:white;
}

.output{
margin-top:25px;
background:#020617;
padding:20px;
border-radius:20px;
overflow:auto;
max-height:350px;
white-space:pre-wrap;
border:1px solid rgba(255,255,255,.08);
}

.footer{
margin-top:20px;
text-align:center;
color:#94a3b8;
}

</style>

</head>
<body>

<div class="container">

<div class="logo">⚡ TURBO CONFIG</div>

<div class="subtitle">
GitHub Pages + Cloudflare Ready
</div>

<div class="stats">

<div class="card">
<h3>DNS</h3>
<p>1.1.1.1</p>
</div>

<div class="card">
<h3>Protocol</h3>
<p>HTTP/3</p>
</div>

<div class="card">
<h3>Security</h3>
<p>TLS 1.3</p>
</div>

</div>

<div class="buttons">

<button class="generate" onclick="generateConfig()">
⚡ ساخت کانفیگ
</button>

<a id="downloadBtn" class="download">
📥 دانلود کانفیگ
</a>

</div>

<div class="output" id="output">
برای ساخت کانفیگ روی دکمه بالا کلیک کنید...
</div>

<div class="footer">
Turbo Generator v1.0
</div>

</div>

<script>

function randomString(length){
let result='';
let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

for(let i=0;i<length;i++){
result+=chars.charAt(
Math.floor(Math.random()*chars.length)
);
}
return result;
}

function generateConfig(){

let config = {
id: randomString(16),
server: "Cloudflare",
dns_primary: "1.1.1.1",
dns_secondary: "1.0.0.1",
protocol: "HTTP/3",
tls: "1.3",
ipv6: true,
security: "High",
created: new Date().toLocaleString(),
token: randomString(32),
key: randomString(64)
};

let json = JSON.stringify(config,null,4);

document.getElementById("output")
.textContent=json;

let blob = new Blob(
[json],
{type:"application/json"}
);

let url = URL.createObjectURL(blob);

let btn =
document.getElementById("downloadBtn");

btn.href=url;
btn.download="turbo-config.json";
btn.style.display="block";
}

</script>

</body>
</html>
